<?xml version="1.0" encoding="UTF-8"?>
<!-- ShotClock app icon: stopwatch face in SPM colors.
     192×192 viewBox; maskable-safe: design occupies the inner 80% (safe zone)
     so Android adaptive icons can crop the corners without losing the
     glyph. Single SVG used for both Chrome PWA manifest and iOS
     apple-touch-icon (iOS 13+ accepts SVG). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="ShotClock">
  <!-- background plate (SPM accent navy) -->
  <rect width="192" height="192" rx="40" fill="#0031a1"/>
  <!-- stopwatch crown (top button + side nubs) -->
  <rect x="84" y="14" width="24" height="14" rx="4" fill="#fff"/>
  <rect x="70" y="20" width="12" height="6" rx="2" fill="#fff" opacity="0.85"/>
  <rect x="110" y="20" width="12" height="6" rx="2" fill="#fff" opacity="0.85"/>
  <!-- watch body: outer ring (white) + dial (navy) -->
  <circle cx="96" cy="110" r="64" fill="#fff"/>
  <circle cx="96" cy="110" r="56" fill="#0031a1"/>
  <!-- tick marks at 12 / 3 / 6 / 9 -->
  <rect x="94" y="58" width="4" height="10" rx="1" fill="#fff"/>
  <rect x="94" y="152" width="4" height="10" rx="1" fill="#fff"/>
  <rect x="44" y="108" width="10" height="4" rx="1" fill="#fff"/>
  <rect x="138" y="108" width="10" height="4" rx="1" fill="#fff"/>
  <!-- intermediate small ticks -->
  <g fill="#fff" opacity="0.55">
    <circle cx="121" cy="68" r="1.5"/>
    <circle cx="138" cy="85" r="1.5"/>
    <circle cx="138" cy="135" r="1.5"/>
    <circle cx="121" cy="152" r="1.5"/>
    <circle cx="71" cy="152" r="1.5"/>
    <circle cx="54" cy="135" r="1.5"/>
    <circle cx="54" cy="85" r="1.5"/>
    <circle cx="71" cy="68" r="1.5"/>
  </g>
  <!-- hands: minute up (long), hour to ~2 o'clock (short) -->
  <line x1="96" y1="110" x2="96" y2="68" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <line x1="96" y1="110" x2="122" y2="92" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <!-- pivot (SPM primary red — the cue-ball accent) -->
  <circle cx="96" cy="110" r="7" fill="#ea002a"/>
  <circle cx="96" cy="110" r="3" fill="#fff"/>
</svg>
